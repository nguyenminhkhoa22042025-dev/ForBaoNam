<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome NYP</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #fff;
        }

        #message {
            display: none;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <button id="button" onclick="showMessage()">Ấn vào đây</button>

    <div id="message">Welcome NYP</div>

    <script>
        function showMessage() {
            document.getElementById("button").style.display = "none";
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
